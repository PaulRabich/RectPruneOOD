[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "APES"
version = "0.1.0"
description = "Implementation of the APES algorithm for OOD detection"

[tool.setuptools]
packages = ["rect_prune_ood"]
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.ruff]
line-length = 88                    
target-version = "py312"                                    
fix = true                         
exclude = ["cache", "results"] 

[tool.ruff.lint]
extend-ignore = ["E501"] 
extend-select = ["E", "I", "F"] # Include all linting rules

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true          

[tool.ruff.lint.isort]
known-first-party = ["rect_prune_ood"] # Your package name for import sorting
